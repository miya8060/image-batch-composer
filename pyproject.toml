[project]
name = "image-batch-composer"
version = "0.1.0"
description = "CSV-driven batch image composer for product visuals (Pillow-based, no generative AI)"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "tqdm>=4.66",
    "streamlit>=1.32",
]

[tool.uv]
package = false

# Streamlit Community Cloud は pyproject.toml を Poetry で読み、PEP 621 形式の
# プロジェクトを `current project as a package` として install しようとして失敗する。
# package-mode = false で「依存解決のみ・パッケージ化はしない」を Poetry に伝える。
[tool.poetry]
package-mode = false
